<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a2b">
<title>Offline · ReKit</title>
<!-- Shown by the service worker when there's no connection. Self-contained and the same for
     everyone, so no personal data is ever stored on the device. -->
<style>
  :root { color-scheme: light dark; --bg: #f3f5f8; --fg: #0f1a2b; --muted: #5a6679; --card: #fff; --line: #d5dbe4; --accent: #1747c9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c121c; --fg: #e8edf5; --muted: #98a3b5; --card: #141c29; --line: #2a3547; --accent: #6f95ff; } }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; max-width: 420px; width: 100%; display: grid; gap: 18px; text-align: center; }
  .logo { font: italic 800 34px "Arial Narrow", Arial, sans-serif; letter-spacing: -.01em; }
  .logo b { background: #d9f24a; color: #1b2400; padding: 0 6px; border-radius: 4px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 4px 0 0; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
  button { font: inherit; font-weight: 700; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="logo">Re<b>Kit</b></div>
    <section><h1>You're offline</h1><p>Check your internet connection, then try again.</p></section>
    <hr>
    <section lang="ar" dir="rtl"><h1>أنت غير متصل بالإنترنت</h1><p>تحقّق من اتصالك بالإنترنت، ثم حاول مجددًا.</p></section>
    <button type="button" onclick="location.reload()">Try again · حاول مجددًا</button>
  </div>
</main>
</body>
</html>
